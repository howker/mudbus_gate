meta:
  vendor: "VZLET"
  model: "TSRV-024"
  profile_version: "1.0.0"
  protocol: "modbus"
  firmware_compat: ["*"]
  description: "TSRV-024: basic current values (vertical slice, no func65 archive yet)."

transport:
  supported: ["tcp", "rtu", "tcp-serial"]
  defaults:
    tcp_port: 502
    baudrate: 9600
    parity: "none"
    stopbits: 1
    response_timeout_ms: 1500
    interframe_delay_ms: 10
    retries: 3

codec:
  word_order_32: "0123"
  word_order_64: "01234567"
  string_encoding: "ansi"

session:
  type: "none"

points:
  - name: "Current heat power"
    space: "IR"
    addr: 100
    type: "float"
    unit: "Gcal/h"
    access: "read"
    group: "current"

  - name: "Outdoor temperature"
    space: "IR"
    addr: 104
    type: "scaled_int"
    scale: 0.01
    unit: "C"
    access: "read"
    group: "current"

  - name: "current_time"
    space: "IR"
    addr: 32768
    type: "uint32"
    epoch: "1970-01-01"
    access: "read"
    group: "time"
    note: "IR 0x8000 (32768): device clock, read-only view. 4-byte Unix timestamp - same VZLET register map as IVK-TER (mb_reg_ivk_ter.pdf), same encoding as archive_time in this profiles own record_layout (already live-verified)."

  - name: "time_set"
    space: "HR"
    addr: 32768
    type: "uint32"
    epoch: "1970-01-01"
    access: "write"
    group: "time"
    note: "HR 0x8000 (32768): device clock, WRITE register (settable only in Service/Setup mode). Marked access:write so the normal poll cycle skips it - written by the set-time CLI command, never read back as a live value."
archives:
  - id: "hourly"
    strategy: "mb_func65"
    time_access: true
    index_access: true
    dst_aware: true
    params:
      archive_type: 0
    note: "TSRV-024 hourly heat-system (TS) archive (index 0), 172-byte record per str_arh_tsrv024.pdf table 1, CRC16-modbus checked (last 2 bytes). Read via VZLET function 65, same generic mechanism as IVK-TER. Known limitation: avg_temp_pipe_N is signed (can be negative in winter) but decodeByLayout's scaled_int type only supports unsigned uint16, so these fields are int16 WITHOUT the *0.01 scale applied (raw hundredths of a degree) - see backlog for a signed-scaled codec type."
    record_layout:
      - { offset: 0, name: "archive_time", type: "uint32", epoch: "1970-01-01" }
      - { offset: 4, name: "clean_work_time", type: "uint16", unit: "min" }
      - { offset: 6, name: "power_loss_downtime", type: "uint16", unit: "min" }
      - { offset: 8, name: "sensor_fail_downtime", type: "uint16", unit: "min" }
      - { offset: 10, name: "ns_total_downtime", type: "uint16", unit: "min" }
      - { offset: 12, name: "nonwork_mode_downtime", type: "uint16", unit: "min" }
      - { offset: 14, name: "ns_counter_1", type: "uint16", unit: "min" }
      - { offset: 16, name: "ns_counter_2", type: "uint16", unit: "min" }
      - { offset: 18, name: "ns_counter_3", type: "uint16", unit: "min" }
      - { offset: 20, name: "ns_counter_4", type: "uint16", unit: "min" }
      - { offset: 22, name: "ns_counter_5", type: "uint16", unit: "min" }
      - { offset: 24, name: "ns_counter_6", type: "uint16", unit: "min" }
      - { offset: 26, name: "ns_counter_7", type: "uint16", unit: "min" }
      - { offset: 28, name: "ns_counter_8", type: "uint16", unit: "min" }
      - { offset: 30, name: "ns_counter_9", type: "uint16", unit: "min" }
