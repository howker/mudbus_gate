meta:
  vendor: "VZLET"
  model: "IVK-TER"
  profile_version: "1.0.0"
  protocol: "modbus"
  archive_period_minutes: 60
  firmware_compat: ["*"]
  description: "ИВК-ТЭР: текущие значения, часы, заводской номер и часовой архив."
transport:
  supported: ["tcp", "rtu", "tcp-serial"]
  defaults:
    tcp_port: 502
    baudrate: 9600
    parity: "none"
    stopbits: 1
    response_timeout_ms: 1000
    interframe_delay_ms: 10
    retries: 3
codec:
  word_order_32: "0123"
  word_order_64: "01234567"
  string_encoding: "ansi"
session:
  type: "none"
points:
  - name: "serial_number"
    space: "IR"
    addr: 32770
    type: "uint32"
    access: "read"
    group: "identity"
    note: "IR 0x8002 (32770): серийный номер вторичного вычислителя ИВК-ТЭР."

  - name: "Текущий расход"
    space: "IR"
    addr: 49204
    type: "float"
    unit: "л/мин"
    access: "read"
    group: "current"
    note: "IR 0xC034 (49204): текущий расход, л/мин; регистр ввода типа вещественное значение по карте Modbus ИВК-ТЭР."

  - name: "current_time"
    space: "IR"
    addr: 32768
    type: "uint32"
    epoch: "1970-01-01"
    access: "read"
    group: "time"
    note: "IR 0x8000 (32768): часы прибора, чтение. 4-байтовая метка Unix, как archive_time в часовом архиве."

  - name: "time_set"
    space: "HR"
    addr: 32768
    type: "uint32"
    epoch: "1970-01-01"
    access: "write"
    group: "time"
    note: "HR 0x8000 (32768): установка часов разрешена только вручную в сервисном режиме прибора. Обычный цикл опроса этот регистр не записывает."

archives:
  - id: "hourly"
    strategy: "mb_func65"
    time_access: true
    index_access: true
    params:
      archive_type: 0
    note: "Часовой архив ИВК-ТЭР: функция Modbus 65, архив 0. Запись 30 байт; отдельного CRC внутри записи нет."
    record_layout:
      - { offset: 0, name: "archive_time", type: "uint32", epoch: "1970-01-01" }
      - { offset: 4, name: "v_plus", type: "float", unit: "м³" }
      - { offset: 8, name: "v_minus", type: "float", unit: "м³" }
      - { offset: 12, name: "q_avg", type: "float", unit: "л/мин" }
      - { offset: 16, name: "resistance", type: "float", unit: "Ом" }
      - { offset: 20, name: "errors", type: "bitfield" }
      - { offset: 22, name: "comm_fail_time", type: "uint16", unit: "мин" }
      - { offset: 24, name: "flowmeter_type", type: "bitfield" }
      - { offset: 26, name: "downtime", type: "uint16", unit: "мин" }
      - { offset: 28, name: "power_loss_time", type: "uint16", unit: "мин" }
