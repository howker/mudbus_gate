meta:
  vendor: "VZLET"
  model: "IVK-TER"
  profile_version: "1.0.0"
  protocol: "modbus"
  firmware_compat: ["*"]
  description: "IVK-TER: basic current values (vertical slice, no composite types yet)."

transport:
  supported: ["tcp", "rtu", "tcp-serial"]
  defaults:
    tcp_port: 502
    baudrate: 9600
    parity: "none"
    stopbits: 1
    response_timeout_ms: 1000
    interframe_delay_ms: 10
    retries: 3

codec:
  word_order_32: "0123"
  word_order_64: "01234567"
  string_encoding: "ansi"

session:
  type: "none"

points:
  - name: "Current flow rate"
    space: "IR"
    addr: 100
    type: "float"
    unit: "m3/h"
    access: "read"
    group: "current"

  - name: "Temperature"
    space: "IR"
    addr: 102
    type: "float"
    unit: "C"
    access: "read"
    group: "current"

archives:
  - id: "hourly"
    strategy: "mb_func65"
    time_access: true
    index_access: true
    params:
      archive_type: 0
    note: "IVK-TER hourly archive (index 0), read via VZLET function 65 - the generic array-read mechanism shared by all VZLET devices (prtkl_Modbus_pril_1.pdf), not a bespoke indexed-binary read. No CRC on this record (str_arh_ivk_ter.pdf table 3: all 30 bytes are accounted for by the 10 fields below, no room for a trailing checksum) - unlike TSRV-024's archives."
    record_layout:
      - { offset: 0, name: "archive_time", type: "uint32", epoch: "1970-01-01" }
      - { offset: 4, name: "v_plus", type: "float", unit: "m3" }
      - { offset: 8, name: "v_minus", type: "float", unit: "m3" }
      - { offset: 12, name: "q_avg", type: "float", unit: "l/min" }
      - { offset: 16, name: "resistance", type: "float", unit: "Ohm" }
      - { offset: 20, name: "errors", type: "bitfield" }
      - { offset: 22, name: "comm_fail_time", type: "uint16", unit: "min" }
      - { offset: 24, name: "flowmeter_type", type: "bitfield" }
      - { offset: 26, name: "downtime", type: "uint16", unit: "min" }
      - { offset: 28, name: "power_loss_time", type: "uint16", unit: "min" }
