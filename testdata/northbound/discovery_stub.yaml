# Пример фикстуры для discovery-режима (M3). Необязателен: без --fixture
# используется нулевая заглушка (все read-ответы заполнены 0x00, записи
# получают стандартный ack). Раскомментируй/добавляй overrides по мере
# того, как discovery-лог покажет реальные адреса, которые ждёт
# Энергосфера (например, регистр статуса, который должен читаться как
# "готово", чтобы драйвер продолжил архивный сценарий).

read_fill_byte: 0x00

overrides: []
  # - unit: 1
  #   function: 3          # 0x03 = Read Holding Registers
  #   address: 8000        # десятичный адрес регистра статуса
  #   response_hex: "0001" # что вернуть вместо генерической заглушки
  #                        # (байты ПОСЛЕ кода функции, hex, без пробелов)