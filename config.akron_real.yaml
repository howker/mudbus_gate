app:
  # Same SQLite file the northbound carrier reads from (--db flag on
  # `mbgw northbound --serve-akron ... --db <path>`). Point BOTH at this
  # exact file so the poller writes what the carrier serves — that's the
  # whole point of this config.
  storage_path: "mbgw.db"
  web_port: 8080 # dashboard: http://127.0.0.1:8080/

devices:
  - id: "akron_real"
    profile: "profiles/acron-01.yaml"
    # current_poll_seconds: how often to poll current values (V/Q/meter
    # clock). This gateway collects ARCHIVES, not real-time telemetry —
    # current values were previously hammered every 3s for no reason.
    # 3600 = once an hour during setup. Raise/lower here without touching
    # code; the archive poll is a separate hourly cycle and a manual
    # "Опросить сейчас" (dashboard / POST /api/poll) can force both anytime.
    current_poll_seconds: 3600
    transport:
      kind: "rtu_serial" # real/virtual COM port (not a raw TCP socket)
      com: "COM105" # the converter-emulated port, per the operator
      baudrate: 9600
      parity: "none"
      stopbits: 1
      timeout_ms: 1000
      unit_id: 1 # confirmed live via tools/akronread --unit 1

# Only read by `mbgw serve` (merged single-process southbound+northbound).
# Same values as the standalone `mbgw northbound --serve-akron --listen
# 127.0.0.1:15021 --db mbgw.db --device akron_real --log
# akron_carrier_live.jsonl` invocation used until now — `mbgw run` ignores
# this section, so nothing changes for the old two-process setup if you
# keep using `run` + `northbound` instead of `serve`.
northbound_akron:
  listen: "127.0.0.1:15021"
  device_id: "akron_real"
  log: "akron_carrier_live.jsonl"